name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  windows-installer:
    name: Windows installer smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "dist/AMOS-Desktop-Windows-x64-Setup.exe"
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -eq 0) {
            throw "Windows installer was not created"
          }
