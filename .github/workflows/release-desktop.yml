name: Release AMOS Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Sign and notarize macOS
    environment: MAC_CSC_LINK
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm test
          npm run check

      - name: Verify release version and signing configuration
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # shellcheck disable=SC2016
          node -e 'const p=require("./package.json"); const tag=process.env.GITHUB_REF_NAME; if (tag !== `v${p.version}`) { console.error(`Tag ${tag} must match package version v${p.version}`); process.exit(1); }'
          test -n "$CSC_LINK" || { echo "::error::MAC_CSC_LINK is not configured"; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "::error::MAC_CSC_KEY_PASSWORD is not configured"; exit 1; }
          test -n "$APPLE_ID" || { echo "::error::APPLE_ID is not configured"; exit 1; }
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "::error::APPLE_APP_SPECIFIC_PASSWORD is not configured"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "::error::APPLE_TEAM_ID is not configured"; exit 1; }

      - name: Install desktop canvas native bindings
        run: npm run canvas:prepare

      - name: Build signed installers
        run: npm run desktop:release
        env:
          AMOS_ROUTER_GGUF_URL: ${{ secrets.AMOS_ROUTER_GGUF_URL }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify release assets
        run: |
          required=(
            dist/AMOS-Desktop-macOS-arm64.dmg
            dist/AMOS-Desktop-macOS-x64.dmg
            dist/AMOS-Desktop-macOS-arm64.zip
            dist/AMOS-Desktop-macOS-x64.zip
            dist/AMOS-Desktop-macOS-arm64.zip.blockmap
            dist/AMOS-Desktop-macOS-x64.zip.blockmap
            dist/latest-mac.yml
          )
          for asset in "${required[@]}"; do
            test -s "$asset" || { echo "::error::Missing release asset: $asset"; exit 1; }
          done
          grep -q "AMOS-Desktop-macOS-arm64.zip" dist/latest-mac.yml ||
            { echo "::error::Update metadata is missing the Apple Silicon ZIP"; exit 1; }
          grep -q "AMOS-Desktop-macOS-x64.zip" dist/latest-mac.yml ||
            { echo "::error::Update metadata is missing the Intel ZIP"; exit 1; }

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/AMOS-Desktop-macOS-arm64.dmg
            dist/AMOS-Desktop-macOS-x64.dmg
            dist/AMOS-Desktop-macOS-arm64.zip
            dist/AMOS-Desktop-macOS-x64.zip
            dist/AMOS-Desktop-macOS-arm64.zip.blockmap
            dist/AMOS-Desktop-macOS-x64.zip.blockmap
            dist/latest-mac.yml

  windows-signing-config:
    name: Check Windows signing availability
    environment: WINDOWS_SIGNING
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check protected signing secrets
        id: check
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGNING_PUBLISHER_NAME }}
        run: |
          required=(
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            WINDOWS_SIGNING_ENDPOINT
            WINDOWS_SIGNING_ACCOUNT_NAME
            WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME
            WINDOWS_SIGNING_PUBLISHER_NAME
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Managed Windows signing is required for an official cross-platform release; missing ${missing[*]}."
            exit 1
          fi

  windows:
    name: Sign and package Windows
    needs: windows-signing-config
    if: needs.windows-signing-config.outputs.configured == 'true'
    environment: WINDOWS_SIGNING
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm test
          npm run check

      - name: Verify release version and signing configuration
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGNING_PUBLISHER_NAME }}
        run: |
          node -e 'const p=require("./package.json"); const tag=process.env.GITHUB_REF_NAME; if (tag !== `v${p.version}`) { console.error(`Tag ${tag} must match package version v${p.version}`); process.exit(1); }'
          $required = @(
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET",
            "WINDOWS_SIGNING_ENDPOINT",
            "WINDOWS_SIGNING_ACCOUNT_NAME",
            "WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME",
            "WINDOWS_SIGNING_PUBLISHER_NAME"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is not configured"
            }
          }
          node -e 'require("./desktop/electron-builder.windows-azure.cjs")'

      - name: Install desktop canvas native bindings
        run: npm run canvas:prepare

      - name: Build signed installer
        run: npm run desktop:release:win
        env:
          AMOS_ROUTER_GGUF_URL: ${{ secrets.AMOS_ROUTER_GGUF_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGNING_PUBLISHER_NAME }}

      - name: Verify Windows release assets and signature
        shell: pwsh
        env:
          WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGNING_PUBLISHER_NAME }}
        run: |
          $required = @(
            "dist/AMOS-Desktop-Windows-x64-Setup.exe",
            "dist/AMOS-Desktop-Windows-x64-Setup.exe.blockmap",
            "dist/latest.yml"
          )
          foreach ($asset in $required) {
            if (!(Test-Path $asset) -or (Get-Item $asset).Length -eq 0) {
              throw "Missing release asset: $asset"
            }
          }
          if (!(Select-String -Path "dist/latest.yml" -Pattern "AMOS-Desktop-Windows-x64-Setup.exe" -Quiet)) {
            throw "Windows update metadata does not reference the signed installer"
          }
          $signature = Get-AuthenticodeSignature "dist/AMOS-Desktop-Windows-x64-Setup.exe"
          if ($signature.Status -ne "Valid") {
            throw "Windows installer signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_SIGNING_PUBLISHER_NAME) {
            throw "Windows installer publisher '$($signature.SignerCertificate.Subject)' does not match the configured publisher"
          }
          $installerBytes = (Get-Item "dist/AMOS-Desktop-Windows-x64-Setup.exe").Length
          if ($installerBytes -gt 1100000000) {
            throw "Windows installer is $installerBytes bytes; the production ceiling is 1100000000 bytes"
          }
          Write-Host "Verified production Windows installer size: $installerBytes bytes"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/AMOS-Desktop-Windows-x64-Setup.exe
            dist/AMOS-Desktop-Windows-x64-Setup.exe.blockmap
            dist/latest.yml

  publish:
    name: Publish verified cross-platform release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: dist

      - name: Verify the complete macOS release
        run: |
          required=(
            dist/AMOS-Desktop-macOS-arm64.dmg
            dist/AMOS-Desktop-macOS-x64.dmg
            dist/AMOS-Desktop-macOS-arm64.zip
            dist/AMOS-Desktop-macOS-x64.zip
            dist/AMOS-Desktop-macOS-arm64.zip.blockmap
            dist/AMOS-Desktop-macOS-x64.zip.blockmap
            dist/latest-mac.yml
          )
          for asset in "${required[@]}"; do
            test -s "$asset" || { echo "::error::Missing release asset: $asset"; exit 1; }
          done
          (
            cd dist
            sha256sum \
              AMOS-Desktop-macOS-arm64.dmg \
              AMOS-Desktop-macOS-x64.dmg \
              AMOS-Desktop-macOS-arm64.zip \
              AMOS-Desktop-macOS-x64.zip \
              AMOS-Desktop-macOS-arm64.zip.blockmap \
              AMOS-Desktop-macOS-x64.zip.blockmap \
              latest-mac.yml \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            dist/AMOS-Desktop-macOS-arm64.dmg
            dist/AMOS-Desktop-macOS-x64.dmg
            dist/AMOS-Desktop-macOS-arm64.zip
            dist/AMOS-Desktop-macOS-x64.zip
            dist/AMOS-Desktop-macOS-arm64.zip.blockmap
            dist/AMOS-Desktop-macOS-x64.zip.blockmap
            dist/latest-mac.yml
            dist/SHA256SUMS.txt
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AMOS Desktop ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

  attach-windows:
    name: Attach signed Windows release
    needs: [publish, windows]
    if: ${{ always() && needs.publish.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist

      - name: Extend the release checksum manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt \
            --dir dist
          (
            cd dist
            sha256sum \
              AMOS-Desktop-Windows-x64-Setup.exe \
              AMOS-Desktop-Windows-x64-Setup.exe.blockmap \
              latest.yml \
              >> SHA256SUMS.txt
          )

      - name: Attach verified Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/AMOS-Desktop-Windows-x64-Setup.exe \
            dist/AMOS-Desktop-Windows-x64-Setup.exe.blockmap \
            dist/latest.yml \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
