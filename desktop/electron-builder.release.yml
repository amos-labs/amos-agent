appId: com.amoslabs.desktop
productName: AMOS Desktop
asar: true
forceCodeSigning: true

files:
  - desktop/**/*
  - src/**/*
  - package.json
  - LICENSE

mac:
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  icon: desktop/assets/amos-mark-1024.png
  artifactName: AMOS-Desktop-macOS-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: AMOS Desktop

publish:
  provider: github
  owner: amos-labs
  repo: amos-agent
  releaseType: release
