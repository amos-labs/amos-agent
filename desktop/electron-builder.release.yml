appId: com.amoslabs.desktop
productName: AMOS Desktop
asar: true
forceCodeSigning: true
extraMetadata:
  amosDesktopReleaseChannel: stable

files:
  - desktop/**/*
  - "!desktop/vendor/**/*"
  - src/**/*
  # Research, evals, tests and docs are not part of the shipped Desktop app.
  - "!src/research/**"
  - "!src/evals/**"
  - "!src/**/*.test.js"
  - "!src/**/__tests__/**"
  - "!src/**/*.md"
  - package.json
  - LICENSE
  # @napi-rs/canvas loads its native binding from a per-platform optional
  # dependency (@napi-rs/canvas-<platform>-<arch>). electron-builder only
  # collects the build machine's arch by default, so the x64 installer shipped
  # only the arm64 binding and crashed on launch ("Cannot find native
  # binding"). Ship every desktop binding so each arch resolves its own.
  - "!node_modules/@napi-rs/canvas-android-*"
  - "!node_modules/@napi-rs/canvas-linux-*"
  - "!node_modules/@napi-rs/canvas-win32-arm64-*"
  - "!node_modules/@napi-rs/canvas-freebsd-*"
  - node_modules/@napi-rs/canvas/**/*
  - node_modules/@napi-rs/canvas-darwin-*/**/*
  - node_modules/@napi-rs/canvas-win32-x64-msvc/**/*

asarUnpack:
  - "node_modules/@napi-rs/**/*.node"

extraResources:
  - from: desktop/vendor/ollama
    to: ollama
    filter:
      - "**/*"
  - from: desktop/vendor/router
    to: router
    filter:
      - "**/*"

mac:
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  icon: desktop/assets/amos-app-icon-1024.png
  artifactName: AMOS-Desktop-macOS-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: AMOS Desktop

win:
  icon: desktop/assets/amos-app-icon-1024.png
  verifyUpdateCodeSignature: true
  artifactName: AMOS-Desktop-Windows-${arch}-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AMOS Desktop
  runAfterFinish: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: amos-labs
  repo: amos-agent
  releaseType: release
