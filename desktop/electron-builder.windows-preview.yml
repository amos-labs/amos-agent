appId: com.amoslabs.desktop.preview
productName: AMOS Desktop Preview
asar: true
forceCodeSigning: false
extraMetadata:
  amosDesktopReleaseChannel: preview

files:
  - desktop/**/*
  - src/**/*
  # Research, evals, tests and docs are not part of the shipped Desktop app.
  - "!src/research/**"
  - "!src/evals/**"
  - "!src/**/*.test.js"
  - "!src/**/__tests__/**"
  - "!src/**/*.md"
  - package.json
  - LICENSE

win:
  icon: desktop/assets/amos-app-icon-1024.png
  verifyUpdateCodeSignature: false
  artifactName: AMOS-Desktop-Windows-Unsigned-Preview-${arch}-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AMOS Desktop Preview
  runAfterFinish: true
  deleteAppDataOnUninstall: false
